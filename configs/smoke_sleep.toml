# Day 1, Strategy A: vLLM sleep mode, QLoRA trainer resident on the GPU.
# Identical to smoke_sequential.toml except [run].strategy/name/output_dir and
# vLLM's memory share (the trainer occupies ~4 GB during rollouts here).

[run]
name = "smoke-sleep"
output_dir = "runs/smoke-sleep"
strategy = "sleep"
seed = 0

[model]
base_model = "Qwen/Qwen3-4B-Instruct-2507"
max_model_len = 12288
lora_rank = 16
lora_alpha = 32

[vllm]
gpu_memory_utilization = 0.62
max_num_seqs = 4

[harbor]
split = "data/harbor/smoke"
harness = "pi"
sandbox = "docker"
agent_timeout_sec = 600
agent_step_limit = 30
max_concurrent_rollouts = 4

[grpo]
num_generations = 4
groups_per_step = 2
max_steps = 3
learning_rate = 1e-5
temperature = 1.0
