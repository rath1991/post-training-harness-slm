# Day 1, Strategy A: vLLM sleep mode, QLoRA trainer resident on the GPU.
# Every shared setting (model, LoRA, harness, limits, GRPO) is a default in
# src/harness_rl/config.py; this file sets only what is specific to this run.
# vLLM keeps the default memory share (0.62): the trainer occupies ~4 GB
# during rollouts here.

[run]
name = "smoke-sleep"
output_dir = "runs/smoke-sleep"
strategy = "sleep"

[harbor]
split = "data/harbor/smoke"
