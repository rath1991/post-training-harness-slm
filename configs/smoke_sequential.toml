# Day 1, Strategy B: full sequential switching, one engine on the GPU at a time.
# Every shared setting (model, LoRA, harness, limits, GRPO) is a default in
# src/harness_rl/config.py; this file sets only what is specific to this run.
# vLLM gets a larger memory share because nothing else is resident during
# rollouts here.

[run]
name = "smoke-sequential"
output_dir = "runs/smoke-sequential"
strategy = "sequential"

[vllm]
gpu_memory_utilization = 0.85

[harbor]
split = "data/harbor/smoke"
