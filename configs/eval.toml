# Held-out evaluation: base and trained models use this same file, and the
# model, LoRA rank, harness, step limit and timeouts all come from the same
# defaults in src/harness_rl/config.py as training, so they always match.
# Use split "data/harbor/ood" for the out-of-distribution set.

[run]
name = "eval"
output_dir = "runs/eval"
strategy = "sequential"

[vllm]
gpu_memory_utilization = 0.85

[harbor]
split = "data/harbor/eval"
