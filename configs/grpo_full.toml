# Day 2: main GRPO run on 400 training tasks (one pass = 400 / groups_per_step steps).
# Set [run].strategy (and the matching [vllm] memory share) to whichever
# strategy wins the Day 1 comparison.
# Every shared setting is a default in src/harness_rl/config.py; this file
# sets only what is specific to this run.

[run]
name = "grpo-full"
output_dir = "runs/grpo-full"
strategy = "sequential"

[vllm]
gpu_memory_utilization = 0.85

[harbor]
split = "data/harbor/train"

[grpo]
groups_per_step = 8
max_steps = 50
