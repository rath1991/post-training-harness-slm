[project]
name = "harness-rl"
version = "0.1.0"
description = "Black-box GRPO and privileged self-distillation of coding agents inside Pi/Harbor/OpenEnv."
requires-python = ">=3.12"
# Exact versions are resolved once by scripts/setup_wsl.sh and frozen into
# env/requirements.lock; these are the lower bounds the code was written against.
dependencies = [
    "openenv[harbor]==0.7.0",
    "transformers>=5.2.0",
    "peft>=0.17",
    "bitsandbytes>=0.45.3",
    "torch>=2.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
inference = ["vllm>=0.32"]
stock = ["trl[kernels]"]
dev = ["pytest>=8"]

[project.scripts]
harness-rl = "harness_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_rl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
